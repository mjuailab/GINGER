[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gist-imputation"
version = "0.1.0"
description = "Gene-aware spatial transcriptomics imputation from a single-cell reference"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5,<2.6",
    "torch-geometric==2.6.1",
    "numpy>=1.26,<3",
    "scipy>=1.11,<1.16",
    "pandas>=2.1,<3",
    "anndata>=0.10,<0.12",
    "h5py>=3.10,<4",
]

[project.scripts]
gist = "gist.cli:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
